<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="温州市瓯海泽雅煜傲五金厂（个体工商户）的公司信息与业务联系方式。">
  <title>煜傲五金厂｜公司信息与联系方式</title>
  <style>
    :root { color-scheme: light; --ink:#16332c; --muted:#586b64; --accent:#176c50; --line:#dce5df; }
    * { box-sizing:border-box; }
    body { margin:0; background:#f5f7f3; color:var(--ink); font-family:system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif; line-height:1.65; }
    a { color:var(--accent); text-underline-offset:4px; }
    .wrap { width:min(1080px,calc(100% - 48px)); margin:auto; }
    header { border-bottom:1px solid var(--line); }
    .header { min-height:88px; display:flex; align-items:center; justify-content:space-between; gap:20px; }
    .brand { font-size:21px; font-weight:750; letter-spacing:2px; }
    .header a { font-size:14px; }
    main { padding:76px 0 64px; }
    .eyebrow { color:var(--accent); font-size:13px; font-weight:700; letter-spacing:3px; margin:0 0 18px; }
    h1 { font-size:clamp(38px,6vw,62px); letter-spacing:-1px; line-height:1.15; margin:0 0 22px; }
    .legal { max-width:650px; color:var(--muted); font-size:18px; margin:0; }
    .grid { display:grid; grid-template-columns:1.5fr 1fr; gap:24px; margin-top:48px; align-items:stretch; }
    .card { background:#fff; border:1px solid var(--line); border-radius:18px; padding:32px; }
    h2 { font-size:22px; line-height:1.3; margin:0 0 24px; }
    dl { margin:0; }
    .detail { display:grid; grid-template-columns:88px minmax(0,1fr); gap:14px; padding:17px 0; border-top:1px solid var(--line); }
    .detail:first-child { padding-top:0; border-top:0; }
    .detail:last-child { padding-bottom:0; }
    dt { color:var(--muted); font-size:14px; padding-top:2px; }
    dd { margin:0; font-size:15px; overflow-wrap:anywhere; }
    .contact { background:var(--ink); color:#fff; display:flex; flex-direction:column; justify-content:space-between; }
    .contact .label { color:#b7cec1; font-size:14px; margin:0 0 8px; }
    .phone { display:block; color:#fff; font-size:clamp(25px,3vw,32px); font-weight:650; text-decoration:none; white-space:nowrap; letter-spacing:-.5px; }
    .contact p { color:#d6e2da; font-size:15px; }
    .call { display:block; background:#fff; color:var(--ink); border-radius:9px; text-align:center; padding:12px 18px; text-decoration:none; font-weight:650; margin-top:30px; }
    .call:hover { background:#e4eee6; }
    a:focus-visible { outline:3px solid #65ab8a; outline-offset:5px; }
    footer { padding:24px 0 30px; border-top:1px solid var(--line); color:var(--muted); font-size:12px; }
    @media(max-width:700px) {
      .wrap { width:calc(100% - 32px); }
      .header { min-height:74px; }
      .brand { font-size:18px; }
      main { padding:46px 0 38px; }
      .legal { font-size:16px; }
      .grid { grid-template-columns:1fr; margin-top:32px; }
      .card { padding:25px 22px; }
      .detail { grid-template-columns:75px minmax(0,1fr); gap:10px; }
      .phone { font-size:30px; }
    }
  </style>
</head>
<body>
  <header>
    <div class="wrap header">
      <div class="brand">煜傲五金厂</div>
      <a href="#contact">联系工厂</a>
    </div>
  </header>
  <main class="wrap">
    <p class="eyebrow">浙江 · 温州</p>
    <h1>煜傲五金厂</h1>
    <p class="legal">温州市瓯海泽雅煜傲五金厂（个体工商户）</p>
    <div class="grid">
      <section class="card" aria-labelledby="company-heading">
        <h2 id="company-heading">公司信息</h2>
        <dl>
          <div class="detail"><dt>登记名称</dt><dd>温州市瓯海泽雅煜傲五金厂（个体工商户）</dd></div>
          <div class="detail"><dt>企业类型</dt><dd>个体工商户</dd></div>
          <div class="detail"><dt>经营场所</dt><dd>浙江省温州市瓯海区泽雅镇戈恬村大源路11号第1幢第4层405室</dd></div>
          <div class="detail"><dt>邮政编码</dt><dd>325000</dd></div>
          <div class="detail"><dt>联系电话</dt><dd><a href="tel:+8618257727099">+86 18257727099</a></dd></div>
        </dl>
      </section>
      <section class="card contact" id="contact" aria-labelledby="contact-heading">
        <div>
          <h2 id="contact-heading">业务联系</h2>
          <p class="label">联系电话</p>
          <a class="phone" href="tel:+8618257727099">182 5772 7099</a>
          <p>业务咨询及合作事项，请通过电话联系。</p>
        </div>
        <a class="call" href="tel:+8618257727099">拨打联系电话</a>
      </section>
    </div>
  </main>
  <footer><div class="wrap">温州市瓯海泽雅煜傲五金厂（个体工商户）</div></footer>
</body>
</html>
